name: arjanstartup
description: Arjan Startup Flutter Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network
  dio: ^5.3.2
  
  # Dependency Injection
  get_it: ^7.6.0
  injectable: ^2.3.2

  # Data Class & JSON Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Storage & Utilities
  shared_preferences: ^2.2.2
  uuid: ^4.2.1

  # Navigation (New)
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/

  fonts:
    - family: AppFont
      fonts:
        - asset: assets/fonts/Vazir-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazir-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazir.ttf
          weight: 400
        - asset: assets/fonts/Vazir-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700