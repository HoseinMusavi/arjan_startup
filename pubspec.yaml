name: arjan_startup
description: "سفارش آنلاین غذا از ارجان اپ"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # ✅ State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.0
  provider: ^6.1.5+1
  
  # ✅ Routing
  go_router: ^13.0.1
  
  # ✅ Networking
  dio: ^5.4.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  
  # ✅ Storage
  shared_preferences: ^2.2.2
  
  # ✅ UI
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  google_nav_bar: ^5.0.7
  curved_navigation_bar: ^1.0.6
  flutter_html: ^3.0.0
  share_plus: ^12.0.2
  
  # ✅ Map & Location (برای انتخاب آدرس با نقشه)
  flutter_map: ^8.0.0
  latlong2: ^0.9.0
  geolocator: ^9.0.2
  geocoding: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FF7A00"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_padding: true
  remove_alpha_ios: true
  min_sdk_android: 21